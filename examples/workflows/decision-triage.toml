[definition.graph.decisions.ready]
kind = "choice"
question = "Does the request specify observable desired behavior and a way to verify it?"
include_task = true

[[definition.graph.decisions.ready.options]]
id = "yes"
name = "Ready"
description = "The desired behavior and verification method are clear enough to proceed."

[[definition.graph.decisions.ready.options]]
id = "no"
name = "Needs detail"
description = "Essential requirements are missing; ask for clarification."

[[definition.graph.decisions.ready.options]]
id = "uncertain"
name = "Needs assessment"
description = "The request contains conflicting or ambiguous requirements that need assessment."

[definition.graph.decisions.classify]
kind = "choice"
question = "What kind of change does the request describe?"
include_task = true

[[definition.graph.decisions.classify.options]]
id = "feature"
name = "Feature"
description = "Adds or extends a capability."

[[definition.graph.decisions.classify.options]]
id = "fix"
name = "Fix"
description = "Corrects behavior against an existing requirement."

[[definition.graph.decisions.classify.options]]
id = "other"
name = "Other"
description = "Documentation, maintenance, or work outside the other categories."

[definition.graph.decisions.scope]
kind = "choice"
question = "How broad is the change based on the supplied implementation context?"
include_task = true

[[definition.graph.decisions.scope.options]]
id = "small"
name = "Small"
description = "One isolated change within a component."

[[definition.graph.decisions.scope.options]]
id = "medium"
name = "Medium"
description = "Related changes across several components."

[[definition.graph.decisions.scope.options]]
id = "large"
name = "Large"
description = "Architectural changes spanning subsystems."

