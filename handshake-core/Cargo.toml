[package]
name = "handshake-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.17"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
sha2 = "0.11.0"
libc = "0.2.190"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
serde_jcs = "0.2.0"
jsonschema = { version = "0.60.1", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
nouli-core = { git = "https://github.com/standing-desks/nouli.git", rev = "1bc1d9469c86c1d0f52c213dabba02db995d9b8e", version = "0.2.0" }
tokio = { version = "1.54.1", features = ["rt", "time", "net", "io-util", "sync"] }
tokio-util = "0.7.20"
dotenvy = "0.15.7"
